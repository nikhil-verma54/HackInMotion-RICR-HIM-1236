databases:
  - name: ai-resume-analyzer-db
    databaseName: ai_resume_analyzer
    plan: free

services:
  - type: web
    name: ai-resume-analyzer-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      # Firebase credentials as JSON string — paste the full serviceAccountKey.json content
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Render auto-populates DATABASE_URL from the linked PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-analyzer-db
          property: connectionString
